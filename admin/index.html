<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Duality Forge — Metrics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&display=optional" rel="stylesheet">
    <link rel="icon" href="../images/logo/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .stat-card { background: linear-gradient(145deg, #221f1a, #1e1b16); border: 1px solid #3d362a; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-value { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900; color: var(--accent-1); }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #a89880; font-weight: 700; }
        .stat-sub { font-size: 11px; color: #6b5d4d; margin-top: 4px; }
        .user-row { background: #1e1b16; border: 1px solid #2a2418; border-radius: 8px; padding: 12px 16px; }
        .user-row:hover { border-color: #3d362a; }
        .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .badge-google { background: #1a2a1a; color: #34A853; }
        .badge-email { background: #1a1a2a; color: #4285F4; }
        .badge-count { background: #2a2418; color: #d4a017; }
        .tab-btn { padding: 8px 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 2px solid transparent; color: #6b5d4d; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #a89880; }
        .tab-btn.active { color: var(--accent-1); border-bottom-color: var(--accent-1); }
        .insight-row { background: #1e1b16; border: 1px solid #2a2418; border-radius: 8px; padding: 16px; }
        .bar-fill { height: 8px; border-radius: 4px; background: var(--accent-1); transition: width 0.4s ease; }
        .bar-bg { height: 8px; border-radius: 4px; background: #2a2418; width: 100%; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="font-[Cinzel] text-xl font-bold tracking-wide" style="color: var(--accent-1)">📊 Forge Metrics</h1>
            <p class="text-xs text-zinc-500 mt-1">App utilization overview</p>
        </div>

        <div id="authGate" class="text-center mb-8">
            <input id="adminKey" type="password" placeholder="Admin key" class="bg-[#1a1714] border border-[#4a3f30] rounded-lg px-4 py-2 text-sm outline-none focus:border-[#d4a017] placeholder-zinc-600 w-64">
            <button onclick="loadMetrics()" class="ml-2 px-4 py-2 rounded-lg text-xs font-bold uppercase" style="background: var(--accent-1); color: #1a1714;">Load</button>
        </div>

        <!-- Tabs -->
        <div id="tabs" class="hidden border-b border-[#2a2418] flex justify-center gap-2 mb-6">
            <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab('accounts')">Accounts</button>
            <button class="tab-btn" onclick="switchTab('insights')">Insights</button>
        </div>

        <!-- Tab panels -->
        <div id="panel-overview" class="hidden"></div>
        <div id="panel-accounts" class="hidden"></div>
        <div id="panel-insights" class="hidden"></div>

        <p id="error" class="text-center text-red-400 text-sm hidden"></p>

        <div class="text-center mt-10">
            <a href="../" class="text-xs text-zinc-500 hover:text-[#d4a017] transition-colors">← Back to Forge</a>
        </div>
    </div>

    <script>
        let metricsData = null;

        async function loadMetrics() {
            const key = document.getElementById('adminKey').value.trim();
            if (!key) return;
            const errEl = document.getElementById('error');
            errEl.classList.add('hidden');

            try {
                const res = await fetch(`/api/metrics?key=${encodeURIComponent(key)}`);
                if (!res.ok) { errEl.textContent = 'Unauthorized or server error.'; errEl.classList.remove('hidden'); return; }
                metricsData = await res.json();
                document.getElementById('authGate').classList.add('hidden');
                document.getElementById('tabs').classList.remove('hidden');
                renderOverview();
                renderAccounts();
                renderInsights();
                switchTab('overview');
            } catch (e) {
                errEl.textContent = 'Failed to fetch metrics.';
                errEl.classList.remove('hidden');
            }
        }

        function switchTab(name) {
            ['overview', 'accounts', 'insights'].forEach(t => {
                document.getElementById('panel-' + t).classList.toggle('hidden', t !== name);
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === name);
            });
        }

        function renderOverview() {
            const t = metricsData.totals;
            const users = metricsData.users;
            const withProfile = users.filter(u => u.has_profile).length;
            const activeUsers = users.filter(u => u.characters.length || u.tables.length).length;
            document.getElementById('panel-overview').innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                    ${stat('Accounts', t.accounts)}
                    ${stat('Profiles', t.profiles)}
                    ${stat('Characters', t.characters)}
                    ${stat('DM Tables', t.dm_tables)}
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    ${stat('With Profile', withProfile, pct(withProfile, t.accounts))}
                    ${stat('Active Users', activeUsers, pct(activeUsers, t.accounts))}
                    ${stat('Avg Chars/User', activeUsers ? (t.characters / activeUsers).toFixed(1) : '0')}
                </div>`;
        }

        let accountSort = 'activity';

        function sortUsers(users, by) {
            const copy = [...users];
            switch (by) {
                case 'activity': return copy.sort((a, b) => (b.characters.length + b.tables.length) - (a.characters.length + a.tables.length));
                case 'nickname': return copy.sort((a, b) => (a.nickname || 'zzz').localeCompare(b.nickname || 'zzz'));
                case 'last-sign-in': return copy.sort((a, b) => new Date(b.last_sign_in || 0) - new Date(a.last_sign_in || 0));
                case 'created': return copy.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                case 'characters': return copy.sort((a, b) => b.characters.length - a.characters.length);
                case 'tables': return copy.sort((a, b) => b.tables.length - a.tables.length);
                default: return copy;
            }
        }

        function renderAccounts() {
            const users = sortUsers(metricsData.users, accountSort);
            const opts = [['activity','Activity'],['nickname','Nickname'],['last-sign-in','Last Sign-in'],['created','Created'],['characters','Characters'],['tables','Tables']];
            const sortBar = `<div class="flex flex-wrap items-center gap-2 mb-4">
                <span class="text-[10px] text-zinc-600 font-bold uppercase">Sort by:</span>
                ${opts.map(([v,l]) => `<button onclick="accountSort='${v}';renderAccounts()" class="text-[10px] px-2 py-1 rounded ${accountSort===v ? 'text-[#1a1714] font-bold' : 'text-zinc-500 hover:text-[#d4a017]'}" ${accountSort===v ? 'style="background:var(--accent-1)"' : ''}>${l}</button>`).join('')}
            </div>`;

            document.getElementById('panel-accounts').innerHTML = sortBar + `<div class="space-y-3">${users.map(u => {
                const provBadge = u.provider === 'google'
                    ? '<span class="badge badge-google">Google</span>'
                    : '<span class="badge badge-email">Email</span>';
                const nick = u.nickname ? esc(u.nickname) : '<span class="text-zinc-600">no nickname</span>';
                const chars = u.characters.length
                    ? u.characters.map(c => esc(c.name) + (c.is_autosave ? ' <span class="text-zinc-600">(auto)</span>' : '')).join(', ')
                    : '<span class="text-zinc-600">none</span>';
                const tbls = u.tables.length
                    ? u.tables.map(t => esc(t.name) + (t.is_autosave ? ' <span class="text-zinc-600">(auto)</span>' : '')).join(', ')
                    : '<span class="text-zinc-600">none</span>';

                return `<div class="user-row">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <span class="text-sm font-bold text-[#f5efe6]">${nick}</span>
                        ${provBadge}
                        <span class="badge badge-count">${u.characters.length} char</span>
                        <span class="badge badge-count">${u.tables.length} tbl</span>
                        <span class="text-[10px] text-zinc-600 ml-auto">${u.has_profile ? '✅ profile' : '❌ no profile'}</span>
                    </div>
                    <div class="text-xs text-zinc-500"><span class="text-zinc-600 font-bold">Characters:</span> ${chars}</div>
                    <div class="text-xs text-zinc-500"><span class="text-zinc-600 font-bold">Tables:</span> ${tbls}</div>
                    <div class="text-[10px] text-zinc-600 mt-1">
                        Last sign-in: ${u.last_sign_in ? new Date(u.last_sign_in).toLocaleDateString() : 'never'}
                        · Created: ${new Date(u.created_at).toLocaleDateString()}
                    </div>
                </div>`;
            }).join('')}</div>`;
        }
        window.renderAccounts = renderAccounts;

        function renderInsights() {
            const users = metricsData.users;
            const total = users.length || 1;

            const google = users.filter(u => u.provider === 'google').length;
            const email = total - google;
            const withChars = users.filter(u => u.characters.length > 0).length;
            const withTables = users.filter(u => u.tables.length > 0).length;
            const withBoth = users.filter(u => u.characters.length > 0 && u.tables.length > 0).length;
            const withNeither = users.filter(u => !u.characters.length && !u.tables.length).length;

            const now = Date.now();
            const day = 86400000;
            const last7 = users.filter(u => u.last_sign_in && (now - new Date(u.last_sign_in).getTime()) < 7 * day).length;
            const last30 = users.filter(u => u.last_sign_in && (now - new Date(u.last_sign_in).getTime()) < 30 * day).length;
            const neverSignedIn = users.filter(u => !u.last_sign_in).length;

            const createdLast7 = users.filter(u => (now - new Date(u.created_at).getTime()) < 7 * day).length;
            const createdLast30 = users.filter(u => (now - new Date(u.created_at).getTime()) < 30 * day).length;

            document.getElementById('panel-insights').innerHTML = `
                <div class="space-y-6">
                    <div class="insight-row">
                        <h3 class="font-[Cinzel] text-xs font-bold uppercase tracking-wide mb-4" style="color: var(--accent-1)">Auth Provider</h3>
                        ${bar('Google', google, total)}
                        ${bar('Email', email, total)}
                    </div>

                    <div class="insight-row">
                        <h3 class="font-[Cinzel] text-xs font-bold uppercase tracking-wide mb-4" style="color: var(--accent-1)">User Activity</h3>
                        ${bar('Has Characters', withChars, total)}
                        ${bar('Has Tables', withTables, total)}
                        ${bar('Has Both', withBoth, total)}
                        ${bar('Empty Accounts', withNeither, total)}
                    </div>

                    <div class="insight-row">
                        <h3 class="font-[Cinzel] text-xs font-bold uppercase tracking-wide mb-4" style="color: var(--accent-1)">Sign-in Recency</h3>
                        ${bar('Last 7 days', last7, total)}
                        ${bar('Last 30 days', last30, total)}
                        ${bar('Never signed in', neverSignedIn, total)}
                    </div>

                    <div class="insight-row">
                        <h3 class="font-[Cinzel] text-xs font-bold uppercase tracking-wide mb-4" style="color: var(--accent-1)">Growth</h3>
                        ${bar('New (7 days)', createdLast7, total)}
                        ${bar('New (30 days)', createdLast30, total)}
                    </div>
                </div>`;
        }

        function stat(label, value, sub) {
            return `<div class="stat-card"><div class="stat-value">${value}</div><div class="stat-label">${label}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
        }

        function pct(n, total) { return total ? Math.round(n / total * 100) + '% of accounts' : ''; }

        function bar(label, count, total) {
            const p = total ? Math.round(count / total * 100) : 0;
            return `<div class="mb-3">
                <div class="flex justify-between text-xs mb-1"><span class="text-zinc-500">${label}</span><span class="text-[#f5efe6] font-bold">${count} <span class="text-zinc-600">(${p}%)</span></span></div>
                <div class="bar-bg"><div class="bar-fill" style="width:${p}%"></div></div>
            </div>`;
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        document.getElementById('adminKey').addEventListener('keydown', e => { if (e.key === 'Enter') loadMetrics(); });
    </script>
</body>
</html>
