<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duality Forge — Community</title>
    <link rel="icon" href="../images/logo/favicon.ico" sizes="32x32">
    <link rel="icon" href="../images/logo/icon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="../images/logo/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/textures.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/modern.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
</head>
<body class="max-w-[1200px] mx-auto p-4 pb-24">

<nav class="nav-header fixed top-0 left-0 right-0 z-30 bg-[#1a1714]/95 backdrop-blur border-b border-[#3d362a] px-4 py-3" style="will-change:transform">
    <div class="max-w-[1200px] mx-auto">
        <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="../" class="hover:opacity-80 transition-opacity" title="Back to Forge"><img src="../images/logo/new_logo_duality_forge.png" alt="Forge" class="h-14"></a>
                <span class="font-[Cinzel] text-[14px] tracking-widest uppercase font-black italic leading-tight" style="color: var(--accent-1)">Community</span>
            </div>
            <div class="flex items-center justify-center gap-1 flex-wrap">
                <button id="tabBrowse" class="modern-tab-btn active" onclick="switchTab('browse')">🌐 Browse</button>
                <button id="tabMyShares" class="modern-tab-btn" onclick="switchTab('myshares')">📤 My Shares</button>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <div id="authBtn" class="btn-nav px-3 w-auto cursor-pointer" onclick="openAuthModal()"><span class="text-[10px]">Sign In</span></div>
            </div>
        </div>
    </div>
</nav>
<div id="navSpacer" class="h-24"></div>

<!-- Guidance -->
<div class="text-center mb-4 px-4">
    <p class="text-[11px] text-zinc-500 italic leading-relaxed">Shared chapters are story frameworks — narrative notes, NPCs, and music cues to inspire your sessions. Adapt creatures, difficulty, and encounters to fit your table.</p>
</div>



<!-- Filters -->
<div class="space-y-3 mb-6">
    <div class="flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[200px]"><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Search</label><input id="searchInput" type="text" placeholder="Search chapters by title or author..." class="w-full input-search"></div>
        <button onclick="clearFilters()" class="btn-outline py-3">Clear</button>
    </div>
    <div class="flex flex-wrap gap-3 items-end">
        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Environment</label><select id="filterEnv" class="input-compact cursor-pointer"><option value="">All</option><option>City</option><option>Dungeon</option><option>Forest</option><option>Mountain</option><option>Coastal</option><option>Underground</option><option>Ruins</option><option>Tavern</option><option>Desert</option><option>Swamp</option><option>Other</option></select></div>
        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Difficulty</label><select id="filterDiff" class="input-compact cursor-pointer"><option value="">All</option><option>Easy</option><option>Moderate</option><option>Hard</option><option>Deadly</option></select></div>
        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Duration</label><select id="filterDuration" class="input-compact cursor-pointer"><option value="">All</option><option value="Short">Short</option><option value="Medium">Medium</option><option value="Long">Long</option><option value="Extra Long">Extra Long</option></select></div>
        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Sort</label><select id="sortBy" class="input-compact cursor-pointer"><option value="newest">Newest</option><option value="rating">Top Rated</option><option value="popular">Most Imported</option></select></div>
    </div>
</div>

<!-- Results -->
<div id="communityStatus" class="text-center text-zinc-600 text-sm py-8">Loading community chapters...</div>
<div id="communityResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- Chapter Preview Modal -->
<div id="previewModal" class="fixed inset-0 modal-overlay hidden z-50 p-4 overflow-y-auto flex items-start justify-center pt-12" onclick="if(event.target===this)closePreview()">
    <div class="modal-panel p-6 w-full max-w-2xl relative max-h-[85vh] overflow-y-auto">
        <button onclick="closePreview()" class="btn-close absolute top-4 right-4 z-10">✕</button>
        <div id="previewContent"></div>
    </div>
</div>

<!-- Edit Chapter Modal -->
<div id="editModal" class="fixed inset-0 modal-overlay hidden z-50 p-4 overflow-y-auto flex items-start justify-center pt-8" onclick="if(event.target===this)closeEdit()">
    <div class="modal-panel p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-[#363026] pb-3 mb-5">
            <h2 class="font-black text-base uppercase font-[Cinzel] tracking-wide" style="color: var(--accent-1)">Edit Chapter</h2>
            <button onclick="closeEdit()" class="btn-close">✕</button>
        </div>
        <div class="space-y-4">
            <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Title</label><input id="editTitle" type="text" maxlength="80" class="w-full input-field"></div>
            <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Description</label><textarea id="editDescription" rows="2" maxlength="300" class="w-full input-field resize-y"></textarea></div>
            <!-- Content Editor -->
            <div>
                <label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Content</label>
                <div id="editEditorWrap" class="chronicle-editor"></div>
            </div>
            <!-- NPCs -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold">🧑 NPCs & Factions</label>
                    <button onclick="addEditNpc()" class="btn-outline text-[9px] py-1 px-2">+ NPC</button>
                </div>
                <div id="editNpcList" class="space-y-1"></div>
            </div>
            <!-- Music -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold">🎵 Music Cues</label>
                    <button onclick="addEditMusic()" class="btn-outline text-[9px] py-1 px-2">+ Music</button>
                </div>
                <div id="editMusicList" class="space-y-1"></div>
            </div>
            <!-- Metadata -->
            <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Level (min–max)</label><div class="flex items-center gap-1.5"><input id="editLevelMin" type="number" min="1" max="20" class="w-full input-compact text-center"><span class="text-zinc-600 text-xs">–</span><input id="editLevelMax" type="number" min="1" max="20" class="w-full input-compact text-center"></div></div>
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Party Size (min–max)</label><div class="flex items-center gap-1.5"><input id="editPartyMin" type="number" min="1" max="10" class="w-full input-compact text-center"><span class="text-zinc-600 text-xs">–</span><input id="editPartyMax" type="number" min="1" max="10" class="w-full input-compact text-center"></div></div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Environment</label><select id="editEnvironment" class="w-full select-field"><option value="">Select...</option><option>City</option><option>Dungeon</option><option>Forest</option><option>Mountain</option><option>Coastal</option><option>Underground</option><option>Ruins</option><option>Tavern</option><option>Desert</option><option>Swamp</option><option>Other</option></select></div>
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Difficulty</label><select id="editDifficulty" class="w-full select-field"><option value="">Select...</option><option>Easy</option><option>Moderate</option><option>Hard</option><option>Deadly</option></select></div>
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Duration</label><select id="editDuration" class="w-full select-field"><option value="">Select...</option><option value="Short">Short (1hr)</option><option value="Medium">Medium (2-3hr)</option><option value="Long">Long (4-6hr)</option><option value="Extra Long">Extra Long (8hr+)</option></select></div>
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="saveEdit()" class="flex-1 btn-primary">Save Changes</button>
            <button onclick="closeEdit()" class="flex-1 btn-secondary">Cancel</button>
        </div>
    </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="fixed inset-0 modal-overlay hidden z-50 p-4 overflow-y-auto flex items-center justify-center" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal-panel p-6 w-full max-w-sm">
        <div class="flex justify-between items-center border-b border-[#363026] pb-3 mb-5"><h2 class="font-black text-base uppercase font-[Cinzel] tracking-wide" style="color: var(--accent-1)">Sign In</h2><button onclick="closeAuthModal()" class="btn-close">✕</button></div>
        <div class="space-y-4">
            <button onclick="signInWithGoogle()" class="option-card justify-center">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span class="text-sm font-bold text-[#f5efe6] font-[Cinzel]">Continue with Google</span>
            </button>
            <div class="flex items-center gap-3"><div class="flex-1 border-t border-[#3d362a]"></div><span class="text-[10px] text-zinc-600 uppercase">or</span><div class="flex-1 border-t border-[#3d362a]"></div></div>
            <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Email</label><input id="authEmail" type="email" placeholder="your@email.com" class="w-full input-field"></div>
            <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Password</label><input id="authPassword" type="password" placeholder="••••••••" class="w-full input-field"></div>
            <div class="flex gap-3"><button onclick="doSignIn()" class="flex-1 btn-primary">Sign In</button><button onclick="doSignUp()" class="flex-1 btn-secondary">Sign Up</button></div>
            <div class="text-[10px] text-zinc-600 text-center">Sign in to import chapters and rate content.</div>
        </div>
    </div>
</div>

<script type="module" src="../js/community/app.js"></script>
<script type="module" src="../js/core/analytics.js"></script>
</body>
</html>
