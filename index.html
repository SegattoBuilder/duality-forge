<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="wTalv6CLUhM8MRq3dzlsHQ9N5dUZB2kFl1rU6iWvIHQ" />
    <title>Duality Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&display=optional" rel="stylesheet">
    <link rel="icon" href="images/logo/favicon.ico" sizes="32x32">
    <link rel="icon" href="images/logo/icon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/textures.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        .choice-card { background: linear-gradient(145deg, #221f1a, #1e1b16); border: 1px solid #3d362a; border-radius: 16px; padding: 32px; cursor: pointer; transition: all 0.2s; }
        .choice-card:hover { border-color: #d4a017; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-2xl mx-auto px-4">
        <div class="text-center mb-10">
            <img src="images/logo/new_logo_duality_forge.png" alt="Duality Forge" class="mx-auto h-48 mb-4">
            <p class="text-sm text-zinc-500">Your toolkit for the table. Pick a tool to get started.</p>
        </div>

        <div id="choiceGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8"></div>
        <div id="backRow" class="text-center mb-4 hidden">
            <button onclick="goBack()" class="inline-flex items-center gap-1.5 text-xs text-zinc-500 hover:text-[#d4a017] transition-colors">← Back</button>
        </div>

        <div class="text-center">
            <a href="support/" class="inline-flex items-center gap-1.5 text-xs text-zinc-500 hover:text-[#d4a017] transition-colors">🤝 Support & Feedback</a>
        </div>

        <div class="text-center mt-8">
            <p class="text-[10px] text-zinc-500">Fan-made tool — not affiliated with Darrington Press or Critical Role.</p>
            <p class="text-[10px] text-zinc-500 mt-1">☕ <a href="https://buymeacoffee.com/segattobuilder" target="_blank" rel="noopener" class="text-[#d4a017] hover:underline">Buy me a coffee</a></p>
            <p class="text-[10px] text-zinc-600 mt-2"><a href="terms.html" class="hover:text-[#d4a017] transition-colors">Terms of Use</a> · <a href="privacy.html" class="hover:text-[#d4a017] transition-colors">Privacy Policy</a></p>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 modal-overlay hidden z-50 p-4 overflow-y-auto flex items-center justify-center" onclick="if(event.target===this)closeAuthModal()">
        <div class="modal-panel p-6 w-full max-w-sm">
            <div class="flex justify-between items-center border-b border-[#363026] pb-3 mb-5">
                <h2 class="font-black text-base uppercase font-[Cinzel] tracking-wide" style="color: var(--accent-1)">Sign In</h2>
                <button onclick="closeAuthModal()" class="text-[#6b5d4d] hover:text-white text-2xl leading-none">×</button>
            </div>
            <div class="space-y-4">
                <button onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 p-3 bg-[#1a1714] border border-[#4a3f30] rounded-xl hover:border-[#d4a017] transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    <span class="text-sm font-bold text-[#f5efe6] font-[Cinzel]">Continue with Google</span>
                </button>
                <div class="flex items-center gap-3"><div class="flex-1 border-t border-[#3d362a]"></div><span class="text-[10px] text-zinc-600 uppercase">or</span><div class="flex-1 border-t border-[#3d362a]"></div></div>
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Email</label><input id="authEmail" type="email" placeholder="your@email.com" class="w-full bg-[#1a1714] border border-[#4a3f30] rounded-lg px-4 py-3 text-sm outline-none focus:border-[#d4a017] placeholder-zinc-600"></div>
                <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Password</label><input id="authPassword" type="password" placeholder="••••••••" class="w-full bg-[#1a1714] border border-[#4a3f30] rounded-lg px-4 py-3 text-sm outline-none focus:border-[#d4a017] placeholder-zinc-600"></div>
                <div class="flex gap-3">
                    <button onclick="doSignIn()" class="flex-1 btn-action text-xs py-3 rounded-xl font-bold uppercase text-white">Sign In</button>
                    <button onclick="doSignUp()" class="flex-1 bg-[#2a2418] border border-[#3d362a] text-xs py-3 rounded-xl font-bold uppercase text-[#a89880]">Sign Up</button>
                </div>
                <div class="text-[10px] text-zinc-600 text-center"><button onclick="doResetPassword()" class="text-[#d4a017] hover:underline font-bold">Forgot password?</button></div>
                <div class="text-[10px] text-zinc-600 text-center">Sign in to save your data to the cloud across devices.</div>
            </div>
        </div>
    </div>

    <script type="module">
        import SUPABASE_CONFIG from './js/core/config.js';
        import { hasConsent } from './js/core/auth.js';

        const sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
        const grid = document.getElementById('choiceGrid');
        const backRow = document.getElementById('backRow');

        const authCards = `
            <div class="choice-card" onclick="chooseMode('online')">
                <div class="text-center">
                    <div class="text-3xl mb-3">☁️</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">Sign In / Sign Up</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">Cloud sync across devices. Sign in with Google or email to save your data.</p>
                </div>
            </div>
            <div class="choice-card" onclick="chooseMode('offline')">
                <div class="text-center">
                    <div class="text-3xl mb-3">📴</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">Offline Mode</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">No account needed. Your data stays in this browser via local storage/file.</p>
                </div>
            </div>`;

        const toolCards = `
            <div class="choice-card" onclick="go('dm')">
                <div class="text-center">
                    <div class="text-3xl mb-3">⚔️</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">DM Tools</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">Combat tracker, adversary vault, chronicle, compendium search. Everything a DM needs at the table.</p>
                </div>
            </div>
            <div class="choice-card" onclick="go('character')">
                <div class="text-center">
                    <div class="text-3xl mb-3">🗡️</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">Character Sheet</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">Digital character sheet with stats, cards, inventory, gear, and full SRD data integration.</p>
                </div>
            </div>`;

        function showAuthChoice() {
            grid.innerHTML = authCards;
            backRow.classList.add('hidden');
        }

        function showTools() {
            grid.innerHTML = toolCards;
            backRow.classList.remove('hidden');
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
        }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

        function showAlert(msg) { alert(msg); }

        async function doSignIn() {
            const email = document.getElementById('authEmail').value.trim();
            const pw = document.getElementById('authPassword').value;
            if (!email || !pw) { showAlert('Please enter email and password.'); return; }
            const { error } = await sb.auth.signInWithPassword({ email, password: pw });
            if (error) showAlert('Sign-in failed: ' + error.message);
            else { closeAuthModal(); showTools(); }
        }

        async function doSignUp() {
            const email = document.getElementById('authEmail').value.trim();
            const pw = document.getElementById('authPassword').value;
            if (!email || !pw) { showAlert('Please enter email and password.'); return; }
            if (pw.length < 6) { showAlert('Password must be at least 6 characters.'); return; }
            const { error } = await sb.auth.signUp({ email, password: pw });
            if (error) showAlert('Sign-up failed: ' + error.message);
            else showAlert('Check your email for a confirmation link!');
        }

        async function signInWithGoogle() {
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) showAlert('Google sign-in failed: ' + error.message);
        }

        // Check if user is already signed in (e.g. returning from Google OAuth)
        const { data: { session } } = await sb.auth.getSession();
        if (session) { showTools(); backRow.classList.add('hidden'); }
        else showAuthChoice();

        // Listen for password recovery redirect
        sb.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') showPasswordUpdatePrompt();
        });

        function showPasswordUpdatePrompt() {
            let modal = document.getElementById('passwordUpdateModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'passwordUpdateModal';
                modal.className = 'fixed inset-0 modal-overlay z-[9999] p-4 flex items-center justify-center';
                modal.innerHTML = `<div class="modal-panel p-6 w-full max-w-sm">
                    <div class="border-b border-[#363026] pb-3 mb-5"><h2 class="font-black text-base uppercase font-[Cinzel] tracking-wide" style="color: var(--accent-1, #d4a017)">Set New Password</h2></div>
                    <div class="space-y-4">
                        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">New Password</label><input id="newPasswordInput" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" class="w-full bg-[#1a1714] border border-[#4a3f30] rounded-lg px-4 py-3 text-sm outline-none focus:border-[#d4a017] placeholder-zinc-600"></div>
                        <div><label class="text-[10px] text-zinc-500 uppercase tracking-wide font-bold block mb-1">Confirm Password</label><input id="confirmPasswordInput" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" class="w-full bg-[#1a1714] border border-[#4a3f30] rounded-lg px-4 py-3 text-sm outline-none focus:border-[#d4a017] placeholder-zinc-600"></div>
                        <button id="updatePasswordBtn" class="w-full btn-action text-xs py-3 rounded-xl font-bold uppercase text-white">Update Password</button>
                    </div>
                </div>`;
                document.body.appendChild(modal);
            }
            modal.classList.remove('hidden');
            document.getElementById('updatePasswordBtn').onclick = async () => {
                const pw = document.getElementById('newPasswordInput').value;
                const confirm = document.getElementById('confirmPasswordInput').value;
                if (!pw || pw.length < 6) { showAlert('Password must be at least 6 characters.'); return; }
                if (pw !== confirm) { showAlert('Passwords do not match.'); return; }
                const { error } = await sb.auth.updateUser({ password: pw });
                if (error) showAlert('Update failed: ' + error.message);
                else { modal.classList.add('hidden'); showAlert('Password updated successfully!'); }
            };
        }

        // Expose to onclick handlers
        window.go = (tool) => { window.location.href = tool + '/'; };
        window.chooseMode = (mode) => { if (mode === 'online') openAuthModal(); else showTools(); };
        window.goBack = showAuthChoice;
        window.doSignIn = doSignIn;
        window.doSignUp = doSignUp;
        window.signInWithGoogle = signInWithGoogle;
        window.closeAuthModal = closeAuthModal;
        window.doResetPassword = async () => {
            const email = document.getElementById('authEmail').value.trim();
            if (!email) { showAlert('Enter your email address.'); return; }
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/' });
            if (error) showAlert('Reset failed: ' + error.message);
            else showAlert('Check your email for a password reset link!');
        };
    </script>
    <script type="module" src="js/core/analytics.js"></script>
</body>
</html>
